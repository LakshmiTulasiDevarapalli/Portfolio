# Cloud Build configuration for Portfolio App

steps:
  # Step 0: Install dependencies
  - name: 'node:20-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "Installing dependencies..."
        npm install
        echo "Done"

  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--no-cache'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_APP_URL=${_APP_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_BUILD_NUMBER=${BUILD_ID}'
      - '--build-arg'
      - 'NEXT_PUBLIC_COMMIT_SHA=${COMMIT_SHA}'
      - '--build-arg'
      - 'SMTP_HOST=${_SMTP_HOST}'
      - '--build-arg'
      - 'SMTP_PORT=${_SMTP_PORT}'
      - '-t'
      - '${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/portfolio-app:${COMMIT_SHA}'
      - '-t'
      - '${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/portfolio-app:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # Step 2: Push commit SHA tag
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/portfolio-app:${COMMIT_SHA}'

  # Step 3: Push latest tag
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/portfolio-app:latest'

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'portfolio-app'
      - '--image'
      - '${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/portfolio-app:${COMMIT_SHA}'
      - '--region'
      - '${_DEPLOY_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '5'
      - '--set-env-vars'
      - 'NODE_ENV=production,NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL},NEXT_PUBLIC_APP_URL=${_APP_URL},SMTP_HOST=${_SMTP_HOST},SMTP_PORT=${_SMTP_PORT},SMTP_USER=${_SMTP_USER},OWNER_EMAIL=${_OWNER_EMAIL},ADMIN_EMAIL=${_ADMIN_EMAIL}'
      - '--update-secrets'
      - 'NEXT_PUBLIC_SUPABASE_ANON_KEY=portfolio-supabase-anon-key:latest,SUPABASE_SERVICE_ROLE_KEY=portfolio-supabase-service-role-key:latest,SMTP_PASS=portfolio-smtp-password:latest,ADMIN_PASSWORD=portfolio-admin-password:latest'

  # Step 5: Health Check
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "Waiting for deployment..."
        sleep 20
        svc_url=$(gcloud run services describe portfolio-app \
          --region=${_DEPLOY_REGION} \
          --format="value(status.url)")
        echo "Portfolio URL: $svc_url"
        if [ -z "$svc_url" ]; then
          echo "Failed to get service URL"
          exit 1
        fi
        curl -f --max-time 30 "$svc_url" || (echo "Health check failed" && exit 1)
        echo "Deployment successful! Live at: $svc_url"

# Tell Cloud Build to push these images (handles AR auth automatically)
images:
  - '${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/portfolio-app:${COMMIT_SHA}'
  - '${_AR_HOSTNAME}/${_AR_PROJECT_ID}/${_AR_REPOSITORY}/portfolio-app:latest'

substitutions:
  _AR_HOSTNAME: 'us-east4-docker.pkg.dev'
  _AR_PROJECT_ID: 'portfolio-495702'
  _AR_REPOSITORY: 'cloud-run-source-deploy'
  _DEPLOY_REGION: 'us-east4'
  _SUPABASE_URL: 'https://grgnlwwlghwzsysmerse.supabase.co'
  _APP_URL: 'https://portfolio-app-276772531574.us-east4.run.app'
  _SMTP_HOST: 'smtp.gmail.com'
  _SMTP_PORT: '587'
  _SMTP_USER: 'tulasi.devarapalli@gmail.com'
  _OWNER_EMAIL: 'tulasi.devarapalli@gmail.com'
  _ADMIN_EMAIL: 'tulasi.devarapalli@gmail.com'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  substitutionOption: ALLOW_LOOSE

timeout: '1200s'